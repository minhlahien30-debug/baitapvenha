<!DOCTYPE html>
<html>
<head>
    <title>Form đăng ký sinh viên</title>
</head>
<body>

    <h1>Đăng ký sinh viên</h1>

    <form>

        <label>Họ tên:</label>
        <input type="text" name="hoten"
               placeholder="Nhập họ tên" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email"
               placeholder="Nhập email" required>
        <br><br>

        <label>Mật khẩu:</label>
        <input type="password" name="matkhau"
               placeholder="Nhập mật khẩu">
        <br><br>

        <label>Giới tính:</label>
        <input type="radio" name="gioitinh" value="nam"> Nam
        <input type="radio" name="gioitinh" value="nu"> Nữ
        <br><br>

        <label>Sở thích:</label>
        <input type="checkbox" name="sothich" value="doc-sach"> Đọc sách
        <input type="checkbox" name="sothich" value="nghe-nhac"> Nghe nhạc
        <input type="checkbox" name="sothich" value="choi-game"> Chơi game
        <br><br>

        <label>Ngành học:</label>
        <select name="nganhhoc">
            <option value="cntt">CNTT</option>
            <option value="kinhte">Kinh tế</option>
            <option value="dientu">Điện tử</option>
        </select>
        <br><br>

        <label>Ghi chú:</label>
        <br>
        <textarea name="ghichu"
                  placeholder="Nhập ghi chú"></textarea>
        <br><br>

        <input type="submit" value="Gửi">

    </form>

</body>
</html>
